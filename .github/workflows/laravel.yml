name: Laravel Tests

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2

      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist

      - name: Copiar .env
        run: cp .env.example .env

      - name: Generar APP_KEY
        run: php artisan key:generate

      - name: Crear SQLite
        run: touch database/database.sqlite

      - name: Configurar SQLite
        run: |
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=$(pwd)/database/database.sqlite" >> .env

      - name: Ejecutar migraciones
        run: php artisan migrate --force

      - name: Ejecutar seeders
        run: php artisan db:seed --force

      - name: Ejecutar pruebas
        run: php artisan test

      - name: Crear enlaces simbólicos
        run: |
          mkdir -p storage/app/public
          mkdir -p storage/app/scripts
          mkdir -p storage/app/estilos

          php artisan storage:link

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Railway
        run: railway up --service horario
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_GIT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        